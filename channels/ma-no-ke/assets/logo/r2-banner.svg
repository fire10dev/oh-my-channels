    <radialGradient id="mist"><stop stop-color="#C49A45" stop-opacity=".25"/><stop offset="1" stop-color="#C49A45" stop-opacity="0"/></radialGradient>
    <pattern id="distantCut" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
