<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Ma Nó Kể — gương mặt ma</title>
  <desc id="desc">Một nửa mặt ma trắng ngà nghiêng ra khỏi bóng tối, nhìn xéo và cười nhếch.</desc>
  <defs>
    <clipPath id="disc"><circle cx="400" cy="400" r="400"/></clipPath>
    <pattern id="cut" width="42" height="42" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M5 0v42m17-42v42m13-42v42" stroke="#E8DCC0" stroke-width="4" opacity=".16"/>
      <path d="M29 0v42" stroke="#0C0E10" stroke-width="8" opacity=".8"/>
    </pattern>
  </defs>
  <g clip-path="url(#disc)">
    <rect width="800" height="800" fill="#0C0E10"/>
    <path d="M0 0h800v800H0Z" fill="#162219"/>
    <!-- One carved shadow mass, with texture kept away from the face. -->
    <path d="M0 0h482q116 29 187 120 102 131 74 294-18 107-92 179-72 69-180 91L0 800Z" fill="#0C0E10"/>
    <path d="M0 0h482q116 29 187 120 102 131 74 294-18 107-92 179-72 69-180 91L0 800Z" fill="url(#cut)"/>
    <!-- Pale tilted half-face. -->
    <path d="M463 108q168 1 236 133 55 108 9 229-34 91-116 130-69 33-139 2-63-28-91-105-31-86-16-189 17-123 117-200Z" fill="#E8DCC0"/>
    <path d="M462 112q121 7 190 96-98-22-163 7-73 33-116 112 1-144 89-215Z" fill="#C49A45"/>
    <!-- Large sidelong eye, bold enough to read at avatar size. -->
    <path d="M458 337q99-104 211-28-75 104-191 78Z" fill="#0C0E10"/>
    <path d="M471 361q92-82 180-46-74 73-165 67Z" fill="#E8DCC0"/>
    <ellipse cx="561" cy="352" rx="28" ry="44" transform="rotate(25 561 352)" fill="#0C0E10"/>
    <circle cx="550" cy="337" r="9" fill="#E8DCC0"/>
    <path d="M451 331q97-118 230-33" fill="none" stroke="#6B1218" stroke-width="18" stroke-linecap="round"/>
    <!-- Dry, contemptuous half-smile. -->
    <path d="M480 494q96 48 183-15-34 79-132 83-41 2-66-19Z" fill="#0C0E10"/>
    <path d="M493 515q79 29 149-7-59 56-131 42Z" fill="#6B1218"/>
    <path d="M514 539q60 11 99-9" fill="none" stroke="#C49A45" stroke-width="8" stroke-linecap="round"/>
    <!-- Single red incense ember as a small accent. -->
    <path d="M334 468q-31-30 2-67 31 35-2 67Z" fill="#6B1218" stroke="#C49A45" stroke-width="7"/>
    <path d="M336 470q-18 54-5 101" fill="none" stroke="#E8DCC0" stroke-width="8" stroke-linecap="round"/>
    <path d="M329 384q-29-44 4-73m14 78q38-36 21-71" fill="none" stroke="#E8DCC0" stroke-width="7" opacity=".55"/>
    <!-- A restrained rim holds the circular avatar together. -->
    <circle cx="400" cy="400" r="387" fill="none" stroke="#C49A45" stroke-width="7"/>
  </g>
</svg>
